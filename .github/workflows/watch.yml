name: watch
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: watch
  cancel-in-progress: true
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: laya-hf-${{ runner.os }}-v1
      - name: Install Laya
        run: pip install --quiet laya
      - name: Watch
        run: python scripts/watch.py
      - name: Laya self-test
        env:
          LAYA_TEST: '1'
        run: python scripts/watch.py
      - name: Commit stream.json
        run: |
          git config user.name "escogido-watch"
          git config user.email "actions@users.noreply.github.com"
          git add app/data/stream.json
          if git diff --cached --quiet; then
            echo "sin cambios"
          else
            git commit -m "watch: señal/estado $(date -u +%H:%M)" --quiet
            git push --quiet
          fi
      - name: Redeploy Pages con el stream.json nuevo
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml -R JustinLeoni/escogido-en-vivo
